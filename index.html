<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tank Merger: Zombie Orbit (v4)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="layout">
    <section class="stage">
      <div class="stageCanvas">
        <canvas id="c" width="1100" height="650"></canvas>
        <div class="stageUi stageUiLeft">
          <div class="langSwitch" aria-label="Language switcher">
            <button class="langBtn" type="button" data-lang="ru" id="langRu">РУ</button>
            <button class="langBtn" type="button" data-lang="en" id="langEn">EN</button>
          </div>
        </div>
        <div class="stageUi stageUiRight">
          <div class="hud">
            <div class="hudItem"><div class="k" data-i18n="hudCoins">Coins</div><div class="v" id="coins">0</div></div>
            <div class="hudItem"><div class="k" data-i18n="hudKills">Kills</div><div class="v" id="zcount">0</div></div>
            <div class="hudItem"><div class="k" data-i18n="hudBoost">Boost</div><div class="v" id="boostState">—</div></div>
          </div>

          <div class="xpPanel" id="xpWrap">
            <div class="xpLabel" id="lvlText">Уровень: 1</div>
            <div class="xpBar">
              <div id="xpBar" class="xpFill"></div>
            </div>
            <div class="xpValue" id="xpText">0/0</div>
          </div>

          <div class="stageActions">
            <button id="buy" class="btn btnPrimary">
              <span data-i18n="buyTank">Купить танк Lv1</span>
              <span class="price">(<span id="buyCost">50</span>)</span>
            </button>
            <button id="boost" class="btn btnSecondary"><span data-i18n="boostBtn">Буст x2 на 60с (симуляция рекламы)</span></button>
            <button id="talentsBtn" class="btn btnSecondary" type="button" data-i18n="talentsBtn">Таланты</button>
          </div>
        </div>
        <div class="levelModal hidden" id="levelModal" aria-hidden="true">
          <div class="levelModal__backdrop"></div>
          <div class="levelModal__panel" role="dialog" aria-modal="true">
            <div class="levelModal__title" id="levelTitle">Вы достигли 1 уровень</div>
            <div class="levelModal__line" id="levelTalent">Вы получили 1 талант</div>
            <div class="levelModal__line" id="levelGold">Вы получили 0 золота</div>
            <button id="levelAccept" class="btn btnPrimary" type="button" data-i18n="levelUpAccept">Принять награду</button>
          </div>
        </div>
        <div class="crateModal hidden" id="crateModal" aria-hidden="true">
          <div class="crateModal__backdrop" data-crate-close="true"></div>
          <div class="crateModal__panel" role="dialog" aria-modal="true">
            <button class="crateModal__close" id="crateClose" type="button" aria-label="Close">×</button>
            <div class="crateModal__content">
              <canvas id="crateTankIcon" width="80" height="80"></canvas>
              <div class="crateModal__text" id="crateText" data-i18n="crateModalText">Посмотреть рекламу и получить танк</div>
              <button id="crateGet" class="btn btnPrimary" type="button" data-i18n="crateGet">Получить</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
